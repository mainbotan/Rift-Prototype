services:
  php:
    build:
      context: .
      args:
        USER_ID: 1000  # ваш UID на хосте
        GROUP_ID: 1000 # ваш GID на хосте
    volumes:
      - .:/app
      - ../core:/app/vendor/rift/core
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /app
    environment:
      APP_ROOT: /app # явно указываем корень проекта
      COMPOSER_MEMORY_LIMIT: -1
    command: bash -c "composer install && php-fpm"

  nginx:
    image: nginx:alpine
    ports:
      - "84:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    depends_on:
      - php

  composer:
      image: composer:2
      user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
      volumes:
        - .:/app
        - ./../core:/app/../core  # Монтируем core
      working_dir: /app
      environment:
        COMPOSER_HOME: /tmp/composer

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-rift}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8081:80
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      - mysql
    
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP порт для отправки писем
      - "8025:8025" # Web UI
  
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  mysql_data:
  redis_data:
